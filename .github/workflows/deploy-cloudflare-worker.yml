name: Deploy HJ Telegram Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "ec2a5b66d2fd2cd79359c5d928316739"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Worker dependencies
        run: npm install --no-package-lock

      - name: Containerless source guard
        run: |
          set -euo pipefail
          ! grep -RInE 'node:|@cloudflare/containers|durable_objects|MediaListener' src wrangler.jsonc

      - name: Worker integration tests
        run: npm test

      - name: Wrangler dry run
        run: npx wrangler@4.146.0 deploy --dry-run --outdir .wrangler-dry-run

      - name: Deploy when Cloudflare token is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured; deployment intentionally skipped."
            exit 0
          fi
          npx wrangler@4.146.0 deploy
